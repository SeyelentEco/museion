# opencode, the coding agent a prepared drive carries, so that whoever has the
# drive can change Museion with the same local model it answers with: the
# "Edit Museion" launcher (`python -m museion edit`, see museion/edit.py).
#
# Only drives carry it, so it lives here rather than in tools/ (see
# python.toml). The archives are npm's per-platform packages, each holding one
# program at package/bin/opencode (opencode.exe on Windows). npm publishes a
# SHA-512 per package; the SHA-256 below was computed by downloading each.
# Re-verify them if you bump the version.

id = "opencode"
name = "opencode"
version = "1.19.4"
provides = ["opencode"]
license = { name = "MIT", attribution = "opencode contributors" }

[variants.windows-x64]
platform = "windows"
arch = "x64"
file = "opencode-windows-x64-1.19.4.tgz"
url = "https://registry.npmjs.org/opencode-windows-x64/-/opencode-windows-x64-1.19.4.tgz"
size_bytes = 79645877
sha256 = "f7e99cd758187a26daae50c7d2429642013f26bdab4a8b3c12b76428e95dc4e1"

