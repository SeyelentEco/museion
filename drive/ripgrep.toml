# ripgrep, the search program opencode runs for its grep tool. opencode looks
# for `rg` on the PATH and, failing that, downloads ripgrep from GitHub the
# first time it searches -- with no internet that search fails. A drive that
# carries opencode carries this too, in bin/, which "Edit Museion" puts on
# opencode's PATH (museion/edit.py). Found by testing on a real PC: every
# OPENCODE_* switch was on and it still went to GitHub for this.
#
# The version opencode 1.19.4 would download itself. The SHA-256 values are
# the ones ripgrep publishes beside each archive, and were checked against a
# download of each. Each archive holds ripgrep-15.1.0-<target>/rg (rg.exe).

id = "ripgrep"
name = "ripgrep"
version = "15.1.0"
provides = ["rg"]
license = { name = "MIT OR Unlicense", attribution = "Andrew Gallant" }

[variants.windows-x64]
platform = "windows"
arch = "x64"
file = "ripgrep-15.1.0-x86_64-pc-windows-msvc.zip"
url = "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep-15.1.0-x86_64-pc-windows-msvc.zip"
size_bytes = 1810687
sha256 = "124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a"

