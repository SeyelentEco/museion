# The portable Python a prepared drive carries, which runs Museion with
# nothing installed on the computer (see docs/portable.md).
#
# Only drives carry these, so they live here rather than in tools/, which the
# set-up screen installs on every machine. No YAML twin: the Rust app never
# read this folder.
#
# python-build-standalone's install_only_stripped builds: CPython with its
# standard library, SQLite with FTS5, no debug symbols. The same archives CI
# tests Museion on (.github/workflows/python.yml). Each unpacks into a
# folder named python/.

id = "python"
name = "Python"
version = "3.12.12 (python-build-standalone 20251014)"
provides = ["python"]
