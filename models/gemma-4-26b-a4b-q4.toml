# An alternative chat model for the Capable and Generous tiers, beside Qwen.
#
# The same shape as the Qwen MoE -- 25B parameters, 3.8B active -- so it runs
# the same way on an 8-12 GB card: attention on the GPU, experts spilling to
# system RAM. Added September 2026 after it tied Qwen3.6 35B-A3B on the
# Artificial Analysis small-model index and led it on tool use; the Evals
# tab decides which one a library actually does better with.
#
# The plain UD-Q4_K_XL rather than the QAT build: Unsloth's note is that QAT
# helps non-Latin languages, and the standard Q4_K_XL is the better pick for
# English tool calling, which is what the retrieval loop leans on.

