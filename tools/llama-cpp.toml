# llama.cpp — the inference server.
#
# The build is pinned. Upstream ships ten to fifteen builds a day, so "latest"
# is a moving target: it would make every install different from every other
# and every bug report unreproducible. Bumping this is a deliberate act.
#
# Windows builds ship *without* the CUDA runtime DLLs, which come from a
# separate cudart archive and rarely change. The CUDA variant therefore needs
# both, unpacked over each other.

id = "llama-cpp"
name = "llama.cpp"
version = "b10712"
provides = ["llama-server", "llama-fit-params", "llama-bench"]
license = { name = "MIT", attribution = "ggml-org and llama.cpp contributors" }

# Chosen by detected hardware. CUDA first on NVIDIA, Vulkan for AMD/Intel,
# CPU as the fallback that always works.
[variants.windows-cuda]
accelerator = "cuda"
platform = "windows"
file = "llama-b10712-bin-win-cuda-12.4-x64.zip"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b10712/llama-b10712-bin-win-cuda-12.4-x64.zip"
size_bytes = 250588233
sha256 = "2cc00fa626b35d96d42039ebb8458ee3171e2e1385dbc99068ba73011ee15a7a"
also = ["windows-cudart"]

[variants.windows-cudart]
platform = "windows"
internal = true
file = "cudart-llama-bin-win-cuda-12.4-x64.zip"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b10712/cudart-llama-bin-win-cuda-12.4-x64.zip"
size_bytes = 391443627
sha256 = "8c79a9b226de4b3cacfd1f83d24f962d0773be79f1e7b75c6af4ded7e32ae1d6"

[variants.windows-vulkan]
accelerator = "vulkan"
platform = "windows"
file = "llama-b10712-bin-win-vulkan-x64.zip"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b10712/llama-b10712-bin-win-vulkan-x64.zip"
size_bytes = 34954939
sha256 = "6d3ddf4f877a50435e6f27d08f9fa6170b02e905c41f8821661ec80228aebc43"

[variants.windows-cpu]
accelerator = "cpu"
platform = "windows"
file = "llama-b10712-bin-win-cpu-x64.zip"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b10712/llama-b10712-bin-win-cpu-x64.zip"
size_bytes = 18156351
sha256 = "d7275c1aacf7f795d13e48ce006b73bea6d92352199a204d097fae2d6831f3cf"

[variants.macos-arm64]
accelerator = "metal"
platform = "darwin"
arch = "arm64"
file = "llama-b10712-bin-macos-arm64.tar.gz"
url = "https://github.com/ggml-org/llama.cpp/releases/download/b10712/llama-b10712-bin-macos-arm64.tar.gz"
size_bytes = 11041360
sha256 = "8b20c140a04c932596d91bc6b6c23c0f3e67f939b5d621000d4194bfb6ad48fc"
