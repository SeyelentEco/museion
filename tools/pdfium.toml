# pdfium -- Chromium's PDF engine, used to extract text when indexing.
#
# Extraction quality is not a detail: a retrieval system can only find what the
# extractor could read. A lighter parser written in pure Python loses text on multi-column
# and scanned-with-text-layer documents, which is most of this corpus.

id = "pdfium"
name = "pdfium"
version = "chromium/8021"
provides = ["pdfium"]
license = { name = "BSD-3-Clause", attribution = "The Chromium Authors; builds by bblanchon" }

