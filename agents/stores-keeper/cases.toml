[[cases]]
id = "adds-items"
prompt = "We just added 12 cans of beans and 5 kg of flour."
given_files = { "stores.csv" = "item,quantity,unit,per_person_per_day,notes\nrice,10,kg,0.2,\n" }
expect_file = "stores.csv"
expect_tool = ["read_file", "write_file"]

[[cases]]
id = "days-left"
prompt = "How many days will our rice last?"
given_files = { "stores.csv" = "item,quantity,unit,per_person_per_day,notes\nrice,10,kg,0.2,\n", "notes.md" = "- 2026-11-01: The household is 4 people.\n" }
expect_number = { value = 12.5, tolerance = 0 }
expect_tool = ["calculate"]

[[cases]]
id = "asks-household-size"
prompt = "How long will the flour last?"
given_files = { "stores.csv" = "item,quantity,unit,per_person_per_day,notes\nflour,6,kg,0.25,\n" }
person_says = ["We are 3."]
expect_tool = ["ask_person", "calculate"]
expect_number = { value = 8, tolerance = 0 }
