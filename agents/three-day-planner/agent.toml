# 72-hour planner: a plan for the first three days after the power and water
# go, across water, food, shelter and warmth, sanitation and light.
#
# Tests sub-agents: it hands each area to the librarian with delegate, so
# only five short answers fill its own context, not five searches' passages.

name = "72-hour planner"
goal = "Make a prioritised plan for the first three days without power or water."
min_tier = "Capable"
tools = ["delegate", "calculate", "write_file", "ask_person"]
guards = ["calculate_first", "call_again", "cite_or_stand"]
max_rounds = 10
answer_tokens = 2500
memory = "chat"
examples = ["The power and water have been out since this morning. We are a family of four. What do we do?"]

[tier.Generous]
max_rounds = 14
answer_tokens = 3500
